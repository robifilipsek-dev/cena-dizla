<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{orange:'#f97316',cyan:'#06b6d4',purple:'#a855f7',green:'#22c55e',red:'#ef4444',yellow:'#eab308',blue:'#3b82f6'}}}}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.011em}.mono{font-family:'JetBrains Mono',monospace}
.card{background:rgba(24,24,27,.94);border:1px solid #3f3f46;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.input{background:#09090b;border:1px solid #3f3f46;color:#fafafa;border-radius:10px;padding:.75rem 1rem;font-size:.9rem;width:100%;outline:none;transition:all 0.2s}
.input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.08)}

/* Popolnoma odstranjeni gumbi za višanje/nižanje (puščice) v vseh brskalnikih */
input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

.label{display:block;font-size:.75rem;font-weight:700;color:#d4d4d8;margin-bottom:.4rem}
.result{font-family:'JetBrains Mono',monospace;font-weight:700}

<body class="bg-zinc-950 text-zinc-100 min-h-screen p-4 md:p-8 flex items-center justify-center">
<div class="max-w-md w-full space-y-6">
<div class="card p-6 space-y-6">
  <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
    <div>
      <h1 class="text-xl font-extrabold tracking-tight">Izračun cene dizla</h1>
      <p class="text-xs text-zinc-400 mt-1">Slovenija • Shranjevanje cene na napravi</p>
    </div>
    <div class="flex items-center gap-2">
      <!-- Gumb za namestitev aplikacije (skrit, dokler ni na voljo) -->
      <button id="installAppBtn" onclick="installPWA()" title="Namesti aplikacijo" class="hidden w-10 h-10 rounded-xl bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-cyan-400 flex items-center justify-center shrink-0 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
      </button>
      <!-- Ikona za gorivo na sredini -->
      <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 18H6V4h8v16zM8 6h4v4H8V6zm11.29-2.29a1 1 0 0 0-1.42 0L15.17 6.3a1 1 0 0 0 0 1.42l1.42 1.42a1 1 0 0 0 1.42 0l2.71-2.71a1 1 0 0 0 0-1.42zM17 10.41V13a3 3 0 0 1-3 3h-1v2h1a5 5 0 0 0 5-5v-2.59z"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="space-y-4">
    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="label mb-0">Cena dizla [€/l]</label>
        <span id="price-status" class="text-[10px] text-zinc-400">Preverjam ceno …</span>
      </div>
      <div class="relative">
        <input id="fuel-price" class="input pr-16 font-bold text-cyan-50" type="number" step="0.001" oninput="calculate()" onkeypress="allowComma(event)">
        <div class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-zinc-400 font-bold pointer-events-none">€ / l</div>
      </div>
      <div class="flex items-center justify-between mt-2"><span id="price-date" class="text-[10px] text-zinc-500"></span><button onclick="fetchDieselPrice()" class="text-[10px] font-bold text-cyan-400 hover:text-cyan-300">↻ Posodobi</button></div>
    </div>

    <div>
      <label class="label">Količina točenega goriva [litri]</label>
      <input id="liters" class="input" type="number" step="0.01" oninput="calculate()" onkeypress="allowComma(event)">
    </div>

    <div>
      <label class="label">Popust [centi na liter]</label>
      <div class="relative">
        <input id="discount" class="input pr-16" type="number" step="0.1" value="0" oninput="calculate()" onkeypress="allowComma(event)">
        <div class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-zinc-400 font-bold pointer-events-none">centov</div>
      </div>
    </div>
  </div>

  <div class="border-t border-zinc-800 pt-5 space-y-3">
    <div class="flex justify-between text-xs text-zinc-400">
      <span>Osnovna cena brez popusta:</span>
      <span id="base-total" class="result text-zinc-200">0.00 €</span>
    </div>
    <div class="flex justify-between text-xs text-zinc-400">
      <span>Skupni prihranek:</span>
      <span id="total-saving" class="result text-emerald-400">-0.00 €</span>
    </div>
    <div class="bg-zinc-900 border border-cyan-500/30 rounded-xl p-4 flex items-center justify-between">
      <div>
        <div class="text-[11px] font-bold text-cyan-300 uppercase tracking-wider">Znesek za plačilo</div>
        <div class="text-2xl md:text-3xl font-extrabold text-cyan-400 result mt-0.5" id="final-price">0.00 €</div>
      </div>
      <button onclick="copyResult()" class="px-3 py-2 text-xs font-bold rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white transition-colors duration-200">Kopiraj</button>
    </div>
  </div>

  <!-- Sekcija za graf gibanja cen -->
  <div class="border-t border-zinc-800 pt-5 space-y-3">
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold text-zinc-300 uppercase tracking-wider">Gibanje cene dizla (Zadnja 2 meseca)</span>
      <span class="text-[10px] text-zinc-500">Zgodovina GOV.SI</span>
    </div>
    <div class="bg-zinc-900/50 border border-zinc-800 rounded-xl p-3">
      <canvas id="priceChart" width="400" height="200"></canvas>
    </div>
  </div>

</div>
</div>

<script>
let priceChartInstance = null;
let deferredPrompt = null;

// PWA Namestitev
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installAppBtn');
  if (btn) btn.classList.remove('hidden');
});

async function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      console.log('Aplikacija nameščena');
    }
    deferredPrompt = null;
    const btn = document.getElementById('installAppBtn');
    if (btn) btn.classList.add('hidden');
  }
}

window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('installAppBtn');
  if (btn) btn.classList.add('hidden');
  deferredPrompt = null;
});

function allowComma(e) {
  if (e.key === ',') {
    e.preventDefault();
    const input = e.target;
    const start = input.selectionStart;
    const end = input.selectionEnd;
    input.value = input.value.substring(0, start) + '.' + input.value.substring(end);
    input.selectionStart = input.selectionEnd = start + 1;
    input.dispatchEvent(new Event('input'));
  }
}

function calculate() {
  let priceInput = document.getElementById('fuel-price').value.replace(',', '.');
  let discountInput = document.getElementById('discount').value.replace(',', '.');
  let litersInput = document.getElementById('liters').value.replace(',', '.');
  
  let pricePerLitre = parseFloat(priceInput) || 0;
  let liters = parseFloat(litersInput) || 0;
  let discountCents = parseFloat(discountInput) || 0;
  
  if (priceInput !== '') localStorage.setItem('diesel_price', priceInput);
  localStorage.setItem('diesel_discount', discountInput);
  
  let discountPerLitre = discountCents / 100;
  let effectivePricePerLitre = Math.max(0, pricePerLitre - discountPerLitre);
  
  let baseTotal = pricePerLitre * liters;
  let finalTotal = effectivePricePerLitre * liters;
  let totalSaving = baseTotal - finalTotal;
  
  document.getElementById('base-total').textContent = baseTotal.toFixed(2) + ' €';
  document.getElementById('total-saving').textContent = '-' + totalSaving.toFixed(2) + ' €';
  document.getElementById('final-price').textContent = finalTotal.toFixed(2) + ' €';
}

function initChart(labels, dataValues) {
  const ctx = document.getElementById('priceChart').getContext('2d');
  
  if (priceChartInstance) {
    priceChartInstance.data.labels = labels;
    priceChartInstance.data.datasets[0].data = dataValues;
    priceChartInstance.update();
    return;
  }

  priceChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Cena dizla (€/l)',
        data: dataValues,
        borderColor: '#06b6d4',
        backgroundColor: 'rgba(6, 182, 212, 0.1)',
        borderWidth: 2,
        fill: true,
        tension: 0, // Popolnoma ravne linije (brez ukrivljenosti)
        pointBackgroundColor: '#06b6d4',
        pointRadius: 3
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(context) {
              return context.parsed.y.toFixed(3) + ' €/l';
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255, 255, 255, 0.05)' },
          ticks: { color: '#a1a1aa', font: { size: 8 }, maxRotation: 45, minRotation: 45 }
        },
        y: {
          grid: { color: 'rgba(255, 255, 255, 0.05)' },
          ticks: { 
            color: '#a1a1aa', 
            font: { size: 10 },
            callback: function(value) { return value.toFixed(3); }
          }
        }
      }
    }
  });
}

function parseDate(dateStr, year) {
  const parts = dateStr.replace(/\s/g, '').split('.');
  const day = parseInt(parts[0], 10);
  const month = parseInt(parts[1], 10) - 1;
  return new Date(year, month, day);
}

async function fetchDieselPrice() {
  const status = document.getElementById('price-status');
  const dateEl = document.getElementById('price-date');
  status.textContent = 'Preverjam podatke z GOV.SI …';
  status.className = 'text-[10px] text-yellow-400';

  const target = 'https://www.gov.si/teme/cene-naftnih-derivatov/';
  
  const urls = [
    'https://r.jina.ai/' + target,
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(target),
    'https://corsproxy.io/?url=' + encodeURIComponent(target)
  ];

  let historyFetched = false;

  for (const url of urls) {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 6000);
      const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timeout);
      
      if (!response.ok) continue;
      let text = await response.text();
      if (!text || text.length < 100) continue;

      let cleanText = text.replace(/<[^>]+>/g, ' ');
      cleanText = cleanText.replace(/&nbsp;/g, ' ').replace(/\u00A0/g, ' ');

      let history = [];
      const regex = /od\s+(\d{1,2}\.\s*\d{1,2}\.)\s*do\s+(\d{1,2}\.\s*\d{1,2}\.)[^\d]{0,50}(\d{4})[^\d]{0,100}?([1-4][.,]\d{3})[^\d]{0,100}?([1-4][.,]\d{3})/gi;
      
      let match;
      while ((match = regex.exec(cleanText)) !== null) {
        const dateStartStr = match[1];
        const dateEndStr = match[2];
        const year = parseInt(match[3], 10);
        const priceDiesel = parseFloat(match[5].replace(',', '.'));
        
        const startDate = parseDate(dateStartStr, year);
        const endDate = parseDate(dateEndStr, year);
        endDate.setHours(23, 59, 59, 999);

        const label = `${dateStartStr.replace(/\s/g, '')}-${dateEndStr.replace(/\s/g, '')}`;
        
        if (!history.find(h => h.label === label) && priceDiesel > 1.0 && priceDiesel < 3.0) {
            history.push({ label: label, price: priceDiesel, startDate, endDate });
        }
      }

      if (history.length >= 2) {
        history.sort((a, b) => a.startDate - b.startDate);

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        let currentItem = history.find(item => today >= item.startDate && today <= item.endDate);

        if (!currentItem) {
          if (today > history[history.length - 1].endDate) {
            currentItem = history[history.length - 1];
          } else {
            const pastItems = history.filter(item => today > item.endDate);
            currentItem = pastItems.length > 0 ? pastItems[pastItems.length - 1] : history[0];
          }
        }

        const currentPrice = currentItem ? currentItem.price : history[history.length - 1].price;

        let chartHistory = [...history].sort((a, b) => b.startDate - a.startDate).slice(0, 8).reverse();
        const labels = chartHistory.map(item => item.label);
        const prices = chartHistory.map(item => item.price);
        
        document.getElementById('fuel-price').value = currentPrice.toFixed(3);
        
        localStorage.setItem('diesel_price', currentPrice.toFixed(3));
        localStorage.setItem('diesel_price_date', new Date().toISOString());
        localStorage.setItem('diesel_history', JSON.stringify({labels, prices}));

        status.textContent = 'Samodejno posodobljeno';
        status.className = 'text-[10px] text-emerald-400';
        dateEl.textContent = 'Vir: GOV.SI • preverjeno ' + new Date().toLocaleDateString('sl-SI');
        
        calculate();
        initChart(labels, prices);
        historyFetched = true;
        break;
      }
    } catch (e) {
      console.warn("Proxy povezava ni uspela:", url, e);
    }
  }

  // FAIL-SAFE
  if (!historyFetched) {
    const savedPrice = localStorage.getItem('diesel_price');
    const savedDate = localStorage.getItem('diesel_price_date');
    const savedHistory = localStorage.getItem('diesel_history');
    
    if (savedPrice && savedHistory) {
      document.getElementById('fuel-price').value = savedPrice;
      status.textContent = 'Zadnja znana cena';
      status.className = 'text-[10px] text-yellow-400';
      dateEl.textContent = savedDate
        ? 'Zadnja osvežitev: ' + new Date(savedDate).toLocaleDateString('sl-SI')
        : 'Brez povezave (podatki iz naprave)';
      
      const historyData = JSON.parse(savedHistory);
      calculate();
      initChart(historyData.labels, historyData.prices);
    } else {
      status.textContent = 'Naložena zasilna zgodovina';
      status.className = 'text-[10px] text-yellow-400';
      dateEl.textContent = 'GOV.SI podatkov trenutno ni bilo mogoče prebrati.';
      
      const fallbackLabels = ['14.7.-20.7.', '21.7.-27.7.', '28.7.-3.8.', '4.8.-10.8.', '11.8.-17.8.', '18.8.-24.8.', '25.8.-31.8.', '1.9.-7.9.'];
      const fallbackPrices = [1.723, 1.855, 1.828, 1.882, 1.753, 1.857, 1.903, 1.811];
      
      initChart(fallbackLabels, fallbackPrices);
      document.getElementById('fuel-price').value = '1.811';
      calculate();
    }
  }
}

function loadSavedData() {
  const savedDiscount = localStorage.getItem("diesel_discount"); 
  if (savedDiscount !== null) document.getElementById("discount").value = savedDiscount;
  
  const savedHistory = localStorage.getItem('diesel_history');
  if (savedHistory) {
    const h = JSON.parse(savedHistory);
    const savedPrice = localStorage.getItem("diesel_price") || h.prices[h.prices.length - 1];
    document.getElementById("fuel-price").value = savedPrice; 
    initChart(h.labels, h.prices);
  } else {
    initChart(['Ogled', 'podatkov'], [0, 0]);
  }

  calculate(); 
  fetchDieselPrice();
}

function copyResult() {
  const finalPrice = document.getElementById('final-price').textContent;
  navigator.clipboard.writeText(finalPrice);
  alert('Znesek ' + finalPrice + ' je kopiran v odložišče!');
}

window.onload = () => {
  loadSavedData();
};
</script>
</body>
</html>
