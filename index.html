<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{orange:'#f97316',cyan:'#06b6d4',purple:'#a855f7',green:'#22c55e',red:'#ef4444',yellow:'#eab308',blue:'#3b82f6'}}}}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.011em}.mono{font-family:'JetBrains Mono',monospace}
.card{background:rgba(24,24,27,.94);border:1px solid #3f3f46;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.input{background:#09090b;border:1px solid #3f3f46;color:#fafafa;border-radius:10px;padding:.75rem 1rem;font-size:.9rem;width:100%;outline:none;transition:all 0.2s}
.input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.08)}

/* Popolnoma odstranjeni gumbi za višanje/nižanje (puščice) v vseh brskalnikih */
input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

.label{display:block;font-size:.75rem;font-weight:700;color:#d4d4d8;margin-bottom:.4rem}
.result{font-family:'JetBrains Mono',monospace;font-weight:700}
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-4 md:p-8 flex items-center justify-center">
<div class="max-w-md w-full space-y-6">
<div class="card p-6 space-y-6">
  <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
    <div>
      <h1 class="text-xl font-extrabold tracking-tight">Izračun cene dizla</h1>
      <p class="text-xs text-zinc-400 mt-1">Slovenija • Shranjevanje cene na napravi</p>
    </div>
    <!-- Ikona za gorivo -->
    <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 flex items-center justify-center shrink-0">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 18H6V4h8v16zM8 6h4v4H8V6zm11.29-2.29a1 1 0 0 0-1.42 0L15.17 6.3a1 1 0 0 0 0 1.42l1.42 1.42a1 1 0 0 0 1.42 0l2.71-2.71a1 1 0 0 0 0-1.42zM17 10.41V13a3 3 0 0 1-3 3h-1v2h1a5 5 0 0 0 5-5v-2.59z"/>
      </svg>
    </div>
  </div>

  <div class="space-y-4">
    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="label mb-0">Cena dizla [€/l]</label>
        <span id="price-status" class="text-[10px] text-zinc-400">Preverjam ceno …</span>
      </div>
      <div class="relative">
        <input id="fuel-price" class="input pr-16 font-bold text-cyan-50" type="number" step="0.001" oninput="calculate()" onkeypress="allowComma(event)">
        <div class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-zinc-400 font-bold pointer-events-none">€ / l</div>
      </div>
      <div class="flex items-center justify-between mt-2"><span id="price-date" class="text-[10px] text-zinc-500"></span><button onclick="fetchDieselPrice()" class="text-[10px] font-bold text-cyan-400 hover:text-cyan-300">↻ Posodobi</button></div>
    </div>

    <div>
      <label class="label">Količina točenega goriva [litri]</label>
      <input id="liters" class="input" type="number" step="0.01" oninput="calculate()" onkeypress="allowComma(event)">
    </div>

    <div>
      <label class="label">Popust [centi na liter]</label>
      <div class="relative">
        <input id="discount" class="input pr-16" type="number" step="0.1" value="0" oninput="calculate()" onkeypress="allowComma(event)">
        <div class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-zinc-400 font-bold pointer-events-none">centov</div>
      </div>
    </div>
  </div>

  <div class="border-t border-zinc-800 pt-5 space-y-3">
    <div class="flex justify-between text-xs text-zinc-400">
      <span>Osnovna cena brez popusta:</span>
      <span id="base-total" class="result text-zinc-200">0.00 €</span>
    </div>
    <div class="flex justify-between text-xs text-zinc-400">
      <span>Skupni prihranek:</span>
      <span id="total-saving" class="result text-emerald-400">-0.00 €</span>
    </div>
    <div class="bg-zinc-900 border border-cyan-500/30 rounded-xl p-4 flex items-center justify-between">
      <div>
        <div class="text-[11px] font-bold text-cyan-300 uppercase tracking-wider">Znesek za plačilo</div>
        <div class="text-2xl md:text-3xl font-extrabold text-cyan-400 result mt-0.5" id="final-price">0.00 €</div>
      </div>
      <button onclick="copyResult()" class="px-3 py-2 text-xs font-bold rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white transition-colors duration-200">Kopiraj</button>
    </div>
  </div>
</div>
</div>

<script>
function allowComma(e) {
  if (e.key === ',') {
    e.preventDefault();
    const input = e.target;
    const start = input.selectionStart;
    const end = input.selectionEnd;
    input.value = input.value.substring(0, start) + '.' + input.value.substring(end);
    input.selectionStart = input.selectionEnd = start + 1;
    input.dispatchEvent(new Event('input'));
  }
}

function calculate() {
  let priceInput = document.getElementById('fuel-price').value.replace(',', '.');
  let discountInput = document.getElementById('discount').value.replace(',', '.');
  let litersInput = document.getElementById('liters').value.replace(',', '.');
  
  let pricePerLitre = parseFloat(priceInput) || 0;
  let liters = parseFloat(litersInput) || 0;
  let discountCents = parseFloat(discountInput) || 0;
  
  if (priceInput !== '') localStorage.setItem('diesel_price', priceInput);
  localStorage.setItem('diesel_discount', discountInput);
  
  let discountPerLitre = discountCents / 100;
  let effectivePricePerLitre = Math.max(0, pricePerLitre - discountPerLitre);
  
  let baseTotal = pricePerLitre * liters;
  let finalTotal = effectivePricePerLitre * liters;
  let totalSaving = baseTotal - finalTotal;
  
  document.getElementById('base-total').textContent = baseTotal.toFixed(2) + ' €';
  document.getElementById('total-saving').textContent = '-' + totalSaving.toFixed(2) + ' €';
  document.getElementById('final-price').textContent = finalTotal.toFixed(2) + ' €';
}

async function fetchDieselPrice() {
  const status = document.getElementById('price-status');
  const dateEl = document.getElementById('price-date');
  status.textContent = 'Preverjam ceno …';
  status.className = 'text-[10px] text-yellow-400';

  const target = 'https://www.gov.si/teme/cene-naftnih-derivatov/';
  const urls = [
    'https://r.jina.ai/' + target,
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(target),
    'https://corsproxy.io/?url=' + encodeURIComponent(target)
  ];

  for (const url of urls) {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timeout);
      if (!response.ok) continue;
      const text = await response.text();
      if (!text) continue;

      const currentYear = new Date().getFullYear();
      const patterns = [
        /od\s+\d{1,2}\.\s*\d{1,2}\.\s*do\s+\d{1,2}\.\s*\d{1,2}\.\s*\d{4}[^\d]{0,100}([0-9]{1,2}[,.][0-9]{3})[^\d]{0,50}([0-9]{1,2}[,.][0-9]{3})/i,
        /dizel(?:skega)?\s+goriva[^\d]{0,150}([0-9]{1,2}[,.][0-9]{3})/i
      ];

      let price = null;
      for (const re of patterns) {
        const m = text.match(re);
        if (m) {
          const candidate = m[2] || m[1];
          const n = Number(candidate.replace(',', '.'));
          if (n >= 1 && n <= 4) { price = n; break; }
        }
      }

      if (price === null) {
        const lines = text.split(/\r?\n/);
        const month = new Date().getMonth() + 1;
        for (const line of lines) {
          if (line.includes(String(currentYear)) && line.includes('|')) {
            const nums = [...line.matchAll(/([0-9]{1,2}[,.][0-9]{3})/g)].map(x => Number(x[1].replace(',', '.')));
            if (nums.length >= 2 && nums[0] >= 1 && nums[0] <= 4 && nums[1] >= 1 && nums[1] <= 4) {
              if (line.includes('. ' + month + '.') || line.includes('.' + month + '.')) {
                price = nums[1]; break;
              }
            }
          }
        }
      }

      if (price !== null) {
        const value = price.toFixed(3);
        const now = new Date();
        document.getElementById('fuel-price').value = value;
        localStorage.setItem('diesel_price', value);
        localStorage.setItem('diesel_price_date', now.toISOString());
        status.textContent = 'Samodejno posodobljeno';
        status.className = 'text-[10px] text-emerald-400';
        dateEl.textContent = 'Vir: GOV.SI • preverjeno ' + now.toLocaleDateString('sl-SI');
        calculate();
        return true;
      }
    } catch (e) {
      // Naslednji vir
    }
  }

  const savedPrice = localStorage.getItem('diesel_price');
  const savedDate = localStorage.getItem('diesel_price_date');
  if (savedPrice) {
    document.getElementById('fuel-price').value = savedPrice;
    status.textContent = 'Zadnja znana cena';
    status.className = 'text-[10px] text-yellow-400';
    dateEl.textContent = savedDate
      ? 'Zadnja posodobitev: ' + new Date(savedDate).toLocaleDateString('sl-SI')
      : 'Brez povezave';
    calculate();
    return false;
  }

  document.getElementById('fuel-price').value = '1.811';
  status.textContent = 'Samodejna posodobitev ni uspela';
  status.className = 'text-[10px] text-red-400';
  dateEl.textContent = 'Uporabljena privzeta cena 1,811 €/l';
  calculate();
  return false;
}

function loadSavedData() {
  const savedDiscount = localStorage.getItem("diesel_discount"); 
  if (savedDiscount !== null) document.getElementById("discount").value = savedDiscount;
  const savedPrice = localStorage.getItem("diesel_price"); 
  document.getElementById("fuel-price").value = savedPrice || "1.811"; 
  calculate(); 
  fetchDieselPrice();
}

function copyResult() {
  const finalPrice = document.getElementById('final-price').textContent;
  navigator.clipboard.writeText(finalPrice);
  alert('Znesek ' + finalPrice + ' je kopiran v odložišče!');
}

window.onload = () => {
  loadSavedData();
};
</script>
</body>
</html>
